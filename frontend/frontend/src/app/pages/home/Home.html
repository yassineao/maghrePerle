<hero-caroussel />
<collection-grid />
<!--<NASection />-->
@if (products(); as loadedProducts) {
  <Catalogue [productItems]="loadedProducts" />
} @else if (loadFailed()) {
  <section class="bg-ivory px-5 py-20 text-center text-dark-brown" role="alert">
    <p class="font-serif text-2xl font-semibold text-moroccan-green">Impossible de charger les produits.</p>
    <button
      class="mt-5 cursor-pointer rounded-full bg-moroccan-green px-6 py-3 font-semibold text-ivory"
      type="button"
      (click)="loadProducts()"
    >
      Réessayer
    </button>
  </section>
} @else {
  <section
    class="flex min-h-80 flex-col items-center justify-center gap-5 bg-ivory px-5 py-20 text-dark-brown"
    aria-busy="true"
    aria-live="polite"
  >
    <span
      class="block size-14 animate-spin rounded-full border-4 border-warm-gold/30 border-t-moroccan-green"
      aria-hidden="true"
    ></span>
    <p class="font-serif text-xl font-semibold text-moroccan-green">Chargement des produits…</p>
  </section>
}
