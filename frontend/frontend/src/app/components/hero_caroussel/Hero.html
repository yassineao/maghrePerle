<section
  class="relative min-h-[660px] w-full overflow-hidden bg-moroccan-green text-ivory outline-none print:hidden sm:min-h-[720px]"
  tabindex="0"
  aria-roledescription="carousel"
  aria-label="Collections MaghrePerle à la une"
  (mouseenter)="pauseAutoplay()"
  (mouseleave)="resumeAutoplay()"
  (focusin)="pauseAutoplay()"
  (focusout)="resumeAutoplay()"
  (keydown)="onKeyDown($event)"
  (pointerdown)="onPointerDown($event)"
  (pointerup)="onPointerUp($event)"
  (pointercancel)="onPointerUp($event)"
>
  @for (slide of slides; track slide.title; let index = $index) {
    <div
      class="absolute inset-0 transition-opacity duration-1000 motion-reduce:transition-none"
      [class.opacity-100]="currentIndex() === index"
      [class.opacity-0]="currentIndex() !== index"
      [class.pointer-events-none]="currentIndex() !== index"
      [attr.aria-hidden]="currentIndex() !== index"
    >
      <img
        class="absolute inset-0 size-full object-cover object-center"
        [src]="slide.imageSrc"
        [alt]="slide.imageAlt"
        [attr.fetchpriority]="index === 0 ? 'high' : 'auto'"
      />
      <div class="absolute inset-0 bg-gradient-to-r from-dark-brown/90 via-moroccan-green/65 to-transparent"></div>
      <div class="absolute inset-0 bg-gradient-to-t from-dark-brown/55 via-transparent to-moroccan-green/15"></div>

      <div class="relative z-10 mx-auto flex min-h-[660px] max-w-7xl items-center px-6 py-20 sm:min-h-[720px] sm:px-10 lg:px-16">
        <div class="max-w-2xl">
          <div class="mb-6 flex items-center gap-3">
            <span class="h-px w-12 bg-warm-gold"></span>
            <span class="text-xs font-bold tracking-[0.25em] text-warm-gold uppercase">{{ slide.eyebrow }}</span>
          </div>
          <h1 class="text-balance font-serif text-5xl leading-[0.98] font-semibold tracking-tight sm:text-7xl lg:text-8xl">{{ slide.title }}</h1>
          <p class="mt-7 max-w-xl text-base leading-8 text-ivory/75 sm:text-lg">{{ slide.description }}</p>
          <div class="mt-9 flex flex-wrap items-center gap-4">
            <a class="rounded-full bg-warm-gold px-7 py-3.5 text-sm font-bold text-dark-brown no-underline transition hover:-translate-y-0.5 hover:bg-ivory focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-warm-gold" [routerLink]="slide.ctaUrl">
              {{ slide.ctaText }}
            </a>
            <a class="rounded-full border border-ivory/40 px-7 py-3.5 text-sm font-bold text-ivory no-underline backdrop-blur transition hover:border-warm-gold hover:text-warm-gold" routerLink="/about">À propos de MaghrePerle</a>
          </div>
        </div>
      </div>

      <span class="absolute right-8 bottom-8 hidden font-serif text-8xl leading-none text-ivory/10 md:block" aria-hidden="true">{{ slide.accent }}</span>
    </div>
  }
  <button
    class="absolute top-1/2 left-4 z-20 hidden size-11 -translate-y-1/2 cursor-pointer place-items-center rounded-full border border-ivory/30 bg-dark-brown/20 text-ivory backdrop-blur transition hover:border-warm-gold hover:bg-warm-gold hover:text-dark-brown sm:left-7 sm:grid"
    type="button"
    aria-label="Diapositive précédente"
    (click)="previous()"
  >
    <svg
      class="size-5 fill-none stroke-current stroke-2"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="m15 18-6-6 6-6"
      />
    </svg>
  </button>

  <button
    class="absolute top-1/2 right-4 z-20 hidden size-11 -translate-y-1/2 cursor-pointer place-items-center rounded-full border border-ivory/30 bg-dark-brown/20 text-ivory backdrop-blur transition hover:border-warm-gold hover:bg-warm-gold hover:text-dark-brown sm:right-7 sm:grid"
    type="button"
    aria-label="Diapositive suivante"
    (click)="next()"
  >
    <svg
      class="size-5 fill-none stroke-current stroke-2"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="m9 18 6-6-6-6"
      />
    </svg>
  </button>

  <div class="absolute bottom-7 left-1/2 z-20 flex -translate-x-1/2 items-center gap-2 rounded-full border border-ivory/15 bg-dark-brown/25 p-2 backdrop-blur" role="group" aria-label="Choisir une diapositive">
    @for (slide of slides; track slide.title; let index = $index) {
      <button
        class="h-2 cursor-pointer rounded-full transition-[width,background-color] duration-300"
        [class.w-8]="currentIndex() === index"
        [class.w-2]="currentIndex() !== index"
        [class.bg-warm-gold]="currentIndex() === index"
        [class.bg-ivory]="currentIndex() !== index"
        type="button"
        [attr.aria-label]="'Afficher la diapositive ' + (index + 1) + ' : ' + slide.title"
        [attr.aria-current]="currentIndex() === index ? 'true' : null"
        (click)="select(index)"
      ></button>
    }
  </div>
</section>
